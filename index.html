
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #222222;
            font-size: 14px;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .certificate {
            margin: 0 auto;
        }

        .certificate img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #dddddd;
        }

        @media (max-width: 600px) {
            main {
                margin: 20px auto;
                padding: 0 10px;
            }
        }
    </style>
</head>

<body>

<main>

    <section class="certificate">

        <img
            src="Nithin.png"
            alt="Certificate - Nithin P Gowda"
        >

    </section>

</main>

</body>
</html>
